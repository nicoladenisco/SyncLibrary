# imposta path per la factory dei plugin
services.SyncService.classpath=org.sync.sincronizzazione.plugin

# impostazioni di sincronizzazione
services.SyncService.file=sincronizzazione.xml

# dichiarazione regole di sincronizzazione
# il gestore delle regole implementa una strategia generale di sincronizzazione
services.SyncService.sync.plugin.rule.master.generic.classname=RuleMasterXmlRpc
services.SyncService.sync.plugin.rule.slave.generic.classname=RuleSlaveXmlRpc

# dichiarazione di pool dati
# i pool dati implementano logiche di seleziona dei dati customizzabili
services.SyncService.sync.plugin.pool.master.custom.classname=CustomDataPoolMaster
services.SyncService.sync.plugin.pool.master.custom.classpath=org.sync.sincronizzazione

# dichiarazione agent di sincronizzazione
# gli agent implementano la semantica dei data block ovvero l'aggiornamento delle singole tabelle
services.SyncService.sync.plugin.agent.master.tableSync.classname=AgentTableUpdateMaster
services.SyncService.sync.plugin.agent.master.querySync.classname=AgentQueryUpdateMaster
services.SyncService.sync.plugin.agent.master.poolSync.classname=AgentPoolUpdateMaster
services.SyncService.sync.plugin.agent.master.copySync.classname=AgentCopyUpdateMaster

services.SyncService.sync.plugin.agent.master.tableCustomSync.classname=AgentTableUpdateMaster
services.SyncService.sync.plugin.agent.master.queryCustomSync.classname=AgentQueryUpdateMaster
services.SyncService.sync.plugin.agent.master.poolCustomSync.classname=AgentPoolUpdateMaster

services.SyncService.sync.plugin.agent.slave.tableSync.classname=AgentTableUpdateSlave
services.SyncService.sync.plugin.agent.slave.querySync.classname=AgentTableUpdateSlave
services.SyncService.sync.plugin.agent.slave.poolSync.classname=AgentTableUpdateSlave
services.SyncService.sync.plugin.agent.slave.copySync.classname=AgentCopyUpdateSlave

services.SyncService.sync.plugin.agent.slave.tableCustomSync.classname=AgentTableUpdateSlave
services.SyncService.sync.plugin.agent.slave.queryCustomSync.classname=AgentTableUpdateSlave
services.SyncService.sync.plugin.agent.slave.poolCustomSync.classname=AgentTableUpdateSlave
